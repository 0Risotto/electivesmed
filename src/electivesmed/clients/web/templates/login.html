{% extends "base.html" %}
{% block title %}Sign in · electivesmed{% endblock %}
{% block page_title %}Sign in{% endblock %}
{% block content %}
<div class="card card-elevated auth-card">
  <div class="brand">
    <span class="brand-name">electivesmed</span>
  </div>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field">
      <input type="text" name="username" placeholder=" " autocomplete="username" required autofocus>
      <span>Username</span>
    </label>
    <label class="field">
      <input type="password" name="password" placeholder=" " autocomplete="current-password" required>
      <span>Password</span>
    </label>
    <button class="btn btn-filled" type="submit" style="width: 100%;">Sign in</button>
  </form>
  {% if allow_signup %}
  <p class="muted type-body-s" style="text-align: center; margin: 14px 0 0;">
    No account? <a href="/setup">Create account</a>
  </p>
  {% endif %}
</div>
{% endblock %}
