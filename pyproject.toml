[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electivesmed"
version = "0.1.0"
description = "Local-first hospital scouting and personalized outreach agent"
requires-python = ">=3.12"
dependencies = [
  "strands-agents[litellm]>=1.0.0",
  "pydantic>=2.5",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
  "tzdata>=2024.1",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=electivesmed --cov-report=term-missing"

[tool.coverage.run]
source = ["electivesmed"]
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 98
exclude_also = ["if __name__ == .__main__.:"]

[project.scripts]
el = "electivesmed.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
